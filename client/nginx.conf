server {
  listen 80;
  client_max_body_size 12m; # document uploads go through this proxy

  # API calls proxied to the Express container.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback for React Router routes (/whatsapp-simulator, /guard, ...).
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
